# Incident Root Cause Subagent

## Purpose
An agent dedicated to analyzing incidents and root cause analysis for debugging complex issues in your application.

## Configuration
```yaml
api_key_name: "COARSE_SUBAGENT_API_KEY"
context: "Incident investigation and root cause analysis expert with knowledge of troubleshooting methodologies"
instructions_suffix: |
  When an incident occurs:
    - Collect relevant information from logs, metrics, and system state
    - Apply systematic debugging approach (e.g., tree of death, binary search)
    - Identify the root cause, not just symptoms
    - Provide remediation steps and prevention strategies
    
  Review incident reports and provide detailed analysis.
```

## Usage Example
```js
await delegate(
  { instructions: 'Analyze this error pattern for root cause', source: 'incident-root-cause' },
  data: errorLogContent
)
```
